<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BYTE TAP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #0a0d14;
    --surface: #131826;
    --surface-2: #1a2136;
    --border: #232b40;
    --gold: #f2b84b;
    --gold-dim: #8a6a2f;
    --cyan: #4fd8e0;
    --text: #edeff3;
    --muted: #7d8598;
    --danger: #e0594f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    background:
      radial-gradient(circle at 50% 15%, rgba(79,216,224,0.07), transparent 55%),
      var(--bg);
    position: relative;
  }

  /* circuit background lines */
  #app::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(35,43,64,0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(35,43,64,0.5) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(circle at 50% 30%, black, transparent 70%);
    pointer-events: none;
    opacity: 0.5;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 8px;
    z-index: 2;
  }
  .brand {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand .dot { color: var(--cyan); }
  .level-chip {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* ---------- BALANCE ---------- */
  .balance-wrap {
    text-align: center;
    padding: 4px 0 6px;
    z-index: 2;
  }
  .balance {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    text-shadow: 0 0 24px rgba(242,184,75,0.25);
  }
  .balance .unit {
    font-size: 16px;
    color: var(--gold-dim);
    font-weight: 400;
  }
  .per-hour {
    font-size: 12px;
    color: var(--cyan);
    margin-top: 2px;
    font-family: 'Space Mono', monospace;
  }

  /* ---------- TAP ZONE ---------- */
  .tap-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .chip-outer {
    position: relative;
    width: 220px;
    height: 220px;
  }

  .chip-ring {
    position: absolute;
    inset: 0;
    border-radius: 32px;
    border: 2px solid rgba(242,184,75,0.25);
    animation: spin 14s linear infinite;
  }
  .chip-ring::before, .chip-ring::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan);
  }
  .chip-ring::before { top: -4px; left: 50%; transform: translateX(-50%); }
  .chip-ring::after { bottom: -4px; left: 50%; transform: translateX(-50%); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .chip {
    position: absolute;
    inset: 18px;
    border-radius: 28px;
    background: linear-gradient(155deg, #1c2438, #0f1420 70%);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.06s ease;
    box-shadow:
      0 0 0 1px rgba(242,184,75,0.08),
      0 20px 40px -12px rgba(0,0,0,0.6),
      inset 0 0 30px rgba(242,184,75,0.05);
  }
  .chip:active { transform: scale(0.94); }
  .chip.pulse { animation: pulse 0.18s ease; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(242,184,75,0.5), 0 20px 40px -12px rgba(0,0,0,0.6); }
    100% { box-shadow: 0 0 0 22px rgba(242,184,75,0), 0 20px 40px -12px rgba(0,0,0,0.6); }
  }

  .chip svg { width: 96px; height: 96px; }

  .float-num {
    position: absolute;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 22px;
    color: var(--gold);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    text-shadow: 0 0 12px rgba(242,184,75,0.6);
    z-index: 5;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.15); }
  }

  /* ---------- ENERGY ---------- */
  .energy-wrap {
    padding: 6px 20px 4px;
    z-index: 2;
  }
  .energy-label {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .energy-label .val { color: var(--cyan); }
  .energy-bar {
    height: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .energy-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), #7ff0f5);
    transition: width 0.2s ease;
  }

  /* ---------- TABS ---------- */
  .tabs {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--surface);
    z-index: 2;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 13px 0 11px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active {
    color: var(--gold);
    border-bottom: 2px solid var(--gold);
  }

  /* ---------- UPGRADES PANEL ---------- */
  .panel {
    display: none;
    flex-direction: column;
    background: var(--bg);
    height: 46vh;
    overflow-y: auto;
    padding: 12px 14px 20px;
    z-index: 2;
    border-top: 1px solid var(--border);
  }
  .panel.open { display: flex; }

  .upgrade-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .upgrade-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .upgrade-info { flex: 1; min-width: 0; }
  .upgrade-name { font-weight: 700; font-size: 13.5px; }
  .upgrade-desc { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .upgrade-lvl { font-size: 10.5px; color: var(--cyan); font-family: 'Space Mono', monospace; margin-top: 3px; }

  .buy-btn {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    background: var(--surface-2);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    white-space: nowrap;
    min-width: 78px;
    text-align: center;
  }
  .buy-btn:disabled {
    color: var(--muted);
    border-color: var(--border);
    cursor: not-allowed;
  }
  .buy-btn:not(:disabled):active { transform: scale(0.95); }

  .empty-note {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    padding: 30px 10px;
    line-height: 1.6;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .status-line {
    text-align: center;
    font-size: 11.5px;
    color: var(--danger);
    padding: 6px 0 14px;
    min-height: 16px;
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>

<div id="app">

  <div class="topbar">
    <div class="brand">BYTE<span class="dot">.</span>TAP</div>

  </div>

  <div class="balance-wrap">
    <div class="balance"><span id="balance">0</span><span class="unit">BYTE</span></div>
  </div>

  <div class="tap-zone" id="tapZone">
    <div class="chip-outer">
      <div class="chip-ring"></div>
      <div class="chip" id="chip">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="18" width="28" height="28" rx="5" fill="#f2b84b"/>
          <rect x="24" y="24" width="16" height="16" rx="2" fill="#0f1420"/>
          <g stroke="#f2b84b" stroke-width="2.4" stroke-linecap="round">
            <line x1="32" y1="6" x2="32" y2="16"/>
            <line x1="32" y1="48" x2="32" y2="58"/>
            <line x1="6" y1="32" x2="16" y2="32"/>
            <line x1="48" y1="32" x2="58" y2="32"/>
            <line x1="14" y1="14" x2="21" y2="21"/>
            <line x1="43" y1="43" x2="50" y2="50"/>
            <line x1="50" y1="14" x2="43" y2="21"/>
            <line x1="21" y1="43" x2="14" y2="50"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div class="energy-wrap">
    <div class="energy-label">
      <span>ENERGY</span>
      <span class="val"><span id="energyVal">1000</span>/<span id="energyMax">1000</span></span>
    </div>
    <div class="energy-bar"><div class="energy-fill" id="energyFill" style="width:100%"></div></div>
  </div>

  <div class="status-line" id="statusLine">Connecting...</div>

</div>

<script>
(function() {
  // ============================================================
  // НАСТРОЙКА: замени на реальный адрес твоего backend после деплоя
  // Пока для локальных тестов - IP/домен + порт FastAPI-сервера
  // ============================================================
  const API_URL = "https://bytetap.vershina.net.ua";

  // ---------- Получаем Telegram данные ----------
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    setTimeout(() => tg.expand(), 100);
    tg.onEvent('viewportChanged', () => tg.expand());
  }

  // telegram_id реального пользователя. Если приложение открыто не через
  // Telegram (например, просто в браузере для теста) - используем заглушку 12345
  const telegramId = tg?.initDataUnsafe?.user?.id || 12345;

  let state = {
    balance: 0,
    tapPower: 1,
    energy: 1000,
    maxEnergy: 1000,
  };

  function fmt(n) {
    n = Math.floor(n);
    if (n >= 1000000) return (n/1000000).toFixed(2) + "M";
    if (n >= 1000) return (n/1000).toFixed(n >= 10000 ? 0 : 1) + "K";
    return n.toString();
  }

  const balanceEl = document.getElementById("balance");
  const energyValEl = document.getElementById("energyVal");
  const energyMaxEl = document.getElementById("energyMax");
  const energyFillEl = document.getElementById("energyFill");
  const chip = document.getElementById("chip");
  const tapZone = document.getElementById("tapZone");
  const statusLine = document.getElementById("statusLine");

  function renderTop() {
    balanceEl.textContent = fmt(state.balance);
    energyValEl.textContent = Math.floor(state.energy);
    energyMaxEl.textContent = state.maxEnergy;
    energyFillEl.style.width = Math.max(0, Math.min(100, (state.energy/state.maxEnergy)*100)) + "%";
  }

  // ---------- ЗАГРУЗКА ДАННЫХ ИГРОКА С СЕРВЕРА ----------
  // GET /player/{telegram_id} - сервер сам создаст игрока, если его ещё нет,
  // и вернёт актуальную (уже восстановленную) энергию
  async function loadPlayer() {
    try {
      const res = await fetch(`${API_URL}/player/${telegramId}`);
      const data = await res.json();
      state.balance = data.balance;
      state.tapPower = data.tap_power;
      state.energy = data.energy;
      state.maxEnergy = data.max_energy;
      statusLine.textContent = "";
      renderTop();
    } catch (e) {
      statusLine.textContent = "Could not connect to server";
      console.error(e);
    }
  }

  // ---------- TAP LOGIC (Optimistic UI + batching) ----------
  // Идея: тап мгновенно меняет локальный state (никакого ожидания сервера).
  // pendingTaps считает, сколько тапов ещё не отправлено на сервер.
  // Раз в 2 секунды пачка отправляется одним запросом на /tap-batch.
  let pendingTaps = 0;
  let syncInFlight = false;

  function doTap(clientX, clientY) {
    // Локальная проверка энергии - просто для мгновенного отклика интерфейса.
    // Настоящая, надёжная проверка всё равно происходит на сервере в apply_taps().
    if (state.energy < state.tapPower) {
      statusLine.textContent = "Not enough energy";
      return;
    }

    // 1. Мгновенно обновляем локальное состояние - никакого ожидания сети
    state.balance += state.tapPower;
    state.energy -= state.tapPower;
    pendingTaps += 1;
    renderTop();
    statusLine.textContent = "";

    // 2. Визуальный отклик
    chip.classList.remove("pulse");
    void chip.offsetWidth;
    chip.classList.add("pulse");

    const rect = tapZone.getBoundingClientRect();
    const num = document.createElement("div");
    num.className = "float-num";
    num.textContent = "+" + state.tapPower;
    num.style.left = (clientX - rect.left - 10) + "px";
    num.style.top = (clientY - rect.top - 10) + "px";
    tapZone.appendChild(num);
    setTimeout(() => num.remove(), 900);

    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  }

  let lastTapTimestamp = 0;
  const MIN_TAP_INTERVAL_MS = 40;

  chip.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const now = performance.now();
    if (now - lastTapTimestamp < MIN_TAP_INTERVAL_MS) return;
    lastTapTimestamp = now;
    doTap(e.clientX, e.clientY);
  });

  // ---------- BATCH SYNC ----------
  // Раз в 2 секунды отправляем накопленные тапы одним запросом.
  // Сервер - источник истины: он может "срезать" тапы, если энергии
  // реально не хватало (см. apply_taps в database.py) - тогда мы
  // подстраиваем локальный state под то, что подтвердил сервер.
  async function syncTaps() {
    if (pendingTaps === 0 || syncInFlight) return;

    const tapsToSend = pendingTaps;
    pendingTaps = 0; // обнуляем сразу, чтобы новые тапы копились в новый счётчик
    syncInFlight = true;

    try {
      const res = await fetch(
        `${API_URL}/player/${telegramId}/tap-batch?taps=${tapsToSend}`,
        { method: "POST" }
      );
      const data = await res.json();

      // Подтверждаем локальное состояние настоящими цифрами с сервера
      state.balance = data.new_balance;
      state.energy = data.new_energy;
      renderTop();

      if (data.actual_taps < tapsToSend) {
        statusLine.textContent = "Ran out of energy";
      }
    } catch (e) {
      // Запрос не прошёл - возвращаем тапы в очередь, попробуем отправить позже
      pendingTaps += tapsToSend;
      statusLine.textContent = "Connection error, retrying...";
      console.error(e);
    } finally {
      syncInFlight = false;
    }
  }

  setInterval(syncTaps, 2000);

  // ---------- LOCAL ENERGY REGEN ANIMATION ----------
  // Плавно "тикаем" энергию на экране каждую секунду, синхронно со скоростью
  // восстановления на сервере (regen_rate = 1/сек, см. get_current_energy
  // в database.py). Это чисто визуальный эффект - реальное значение всё
  // равно подтверждается сервером через loadPlayer() и syncTaps().
  const REGEN_RATE = 1; // должно совпадать с regen_rate в database.py

  setInterval(() => {
    if (state.energy < state.maxEnergy) {
      state.energy = Math.min(state.maxEnergy, state.energy + REGEN_RATE);
      renderTop();
    }
  }, 1000);

  // Отправляем оставшиеся тапы перед закрытием вкладки, чтобы не потерять прогресс
  window.addEventListener("beforeunload", () => {
    if (pendingTaps > 0) {
      navigator.sendBeacon(
        `${API_URL}/player/${telegramId}/tap-batch?taps=${pendingTaps}`
      );
    }
  });

  // ---------- INIT ----------
  loadPlayer();
})();
</script>

</body>
</html>
